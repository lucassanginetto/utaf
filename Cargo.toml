[package]
name = "utaf"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["query", "macros"] }
axum-embed = "0.1.0"
axum-extra = { version = "0.12.6", features = ["query"] }
reqwest = "0.13.4"
rust-embed = "8.12.0"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
templr = { version = "0.2.5", features = ["axum"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[build-dependencies]
lightningcss = "1.0.0-alpha.72"
